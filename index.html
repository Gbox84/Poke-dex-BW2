<style>
    :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --caught-bg: #1b4d24; 
        --caught-text: #7ee787;
        --feeder-bg: #1f3964; 
        --feeder-text: #79c0ff;
        --exclusive-white: #e0e0e0;
        --exclusive-black: #424242;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab { padding: 10px 20px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .tab:hover:not(.active) { background: #21262d; }
    
    .legend { text-align: center; margin-bottom: 15px; font-size: 0.9em; }
    .legend span { display: inline-block; padding: 4px 8px; margin: 0 5px; border-radius: 4px; font-weight: bold; }
    .leg-caught { background: var(--caught-bg); color: var(--caught-text); }
    .leg-feeder { background: var(--feeder-bg); color: var(--feeder-text); border: 1px solid #388bfd; }
    
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; font-size: 0.95em; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #21262d; position: sticky; top: 0; z-index: 10; text-transform: uppercase; font-size: 0.8em; letter-spacing: 1px; color: var(--text-muted); }
    
    tr { transition: background-color 0.2s ease; }
    tr:hover { background-color: #21262d; }
    tr.w1-caught { background-color: var(--caught-bg); color: var(--caught-text); }
    tr.w2-caught { background-color: var(--caught-bg); color: var(--caught-text); }
    tr.w1-feeder { background-color: var(--feeder-bg); color: var(--feeder-text); }
    
    .sprite { width: 40px; height: 40px; vertical-align: middle; image-rendering: pixelated; }
    .checkbox-cell { text-align: center; width: 50px; }
    input[type="checkbox"] { transform: scale(1.3); cursor: pointer; accent-color: var(--accent); }
    
    .badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 0.7em; font-weight: bold; margin-right: 4px; margin-bottom: 2px; text-transform: uppercase; }
    .badge-white { background: var(--exclusive-white); color: #000; border: 1px solid #999; }
    .badge-black { background: var(--exclusive-black); color: #fff; border: 1px solid #222; text-decoration: line-through; }
    
    details { background: #161b22; border: 1px solid #30363d; padding: 6px; border-radius: 4px; margin-top: 4px; }
    summary { font-weight: bold; cursor: pointer; color: var(--accent); font-size: 0.9em; }
    .optimal-source { font-size: 0.9em; color: #8b949e; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--accent); }
</style>

    let currentTab = 'w1_reg';
    
    function init() {
        renderTable();
    }
    
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderTable();
    }
    
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let filteredData = [];
        if (currentTab === 'w1_reg') {
            filteredData = pokemonData.filter(p => p.is_w1_reg).sort((a, b) => a.w1_id - b.w1_id);
        } else if (currentTab === 'w2_reg') {
            filteredData = pokemonData.filter(p => p.is_w2_reg).sort((a, b) => a.w2_id - b.w2_id);
        } else {
            filteredData = pokemonData.sort((a, b) => a.nat_id - b.nat_id);
        }
        
        filteredData.forEach(p => {
            const caughtW1 = localStorage.getItem('marpaugon_w1_' + p.nat_id) === 'true';
            const caughtW2 = localStorage.getItem('marpaugon_w2_' + p.nat_id) === 'true';
            
            const tr = document.createElement('tr');
            tr.id = 'row_' + p.nat_id;
            
            let isChecked = false;
            let onChangeFunc = '';
            
            if (currentTab === 'w1_reg') {
                isChecked = caughtW1;
                onChangeFunc = `toggleW1(${p.nat_id})`;
                if (caughtW1) tr.classList.add('w1-caught');
            } else {
                isChecked = caughtW2;
                onChangeFunc = `toggleW2(${p.nat_id})`;
                
                if (caughtW2) {
                    tr.classList.add('w2-caught');
                } else if (caughtW1) {
                    tr.classList.add('w1-feeder');
                }
            }
            
            let badges = '';
            let locationHtml = '';
            
            if (currentTab === 'w1_reg') {
                if (p.w1_excl === 'White 1 Exclusive') badges += '<span class="badge badge-white">W1</span>';
                if (p.w1_excl === 'Black 1 Exclusive') badges += '<span class="badge badge-black">B1</span>';
                locationHtml = `<div>${p.w1_loc}</div>`;
            } else {
                if (p.w2_excl === 'White 2 Exclusive') badges += '<span class="badge badge-white">W2</span>';
                if (p.w2_excl === 'Black 2 Exclusive') badges += '<span class="badge badge-black">B2</span>';
                
                if (!p.is_w2_reg && currentTab === 'w2_nat') {
                    locationHtml = `
                        <details>
                            <summary>Inyectar con PKSM</summary>
                            <div class="optimal-source">${p.w2_loc}</div>
                        </details>
                    `;
                } else {
                    locationHtml = `<div>${p.w2_loc}</div>`;
                }
            }
            
            let displayId = '';
            if (currentTab === 'w1_reg') displayId = '#' + String(p.w1_id).padStart(3, '0') + ' <br><small>(N' + p.nat_id + ')</small>';
            else if (currentTab === 'w2_reg') displayId = '#' + String(p.w2_id).padStart(3, '0') + ' <br><small>(N' + p.nat_id + ')</small>';
            else displayId = '#' + String(p.nat_id).padStart(3, '0');
            
            tr.innerHTML = `
                <td class="checkbox-cell">
                    <input type="checkbox" id="cb_${p.nat_id}" ${isChecked ? 'checked' : ''} onchange="${onChangeFunc}">
                </td>
                <td>${displayId}</td>
                <td><img class="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.nat_id}.png" loading="lazy" alt="${p.name}"></td>
                <td><strong>${p.name}</strong><br>${badges}</td>
                <td>${p.evo}</td>
                <td>${locationHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    function toggleW1(id) {
        const cb = document.getElementById('cb_' + id);
        if (cb.checked) {
            localStorage.setItem('marpaugon_w1_' + id, 'true');
            document.getElementById('row_' + id).classList.add('w1-caught');
        } else {
            localStorage.removeItem('marpaugon_w1_' + id);
            document.getElementById('row_' + id).classList.remove('w1-caught');
        }
    }
    
    function toggleW2(id) {
        const cb = document.getElementById('cb_' + id);
        const row = document.getElementById('row_' + id);
        
        if (cb.checked) {
            localStorage.setItem('marpaugon_w2_' + id, 'true');
            row.classList.add('w2-caught');
            row.classList.remove('w1-feeder');
        } else {
            localStorage.removeItem('marpaugon_w2_' + id);
            row.classList.remove('w2-caught');
            if (localStorage.getItem('marpaugon_w1_' + id) === 'true') {
                row.classList.add('w1-feeder');
            }
        }
    }
    
    window.onload = init;
</script>
